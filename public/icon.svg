<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="teaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f4" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle with safe margin -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <!-- Saucer -->
  <ellipse cx="256" cy="400" rx="170" ry="32" fill="#d97706" opacity="0.3" />
  <ellipse cx="256" cy="392" rx="150" ry="24" fill="#ffffff" />
  <ellipse cx="256" cy="390" rx="142" ry="18" fill="#fef3c7" />

  <!-- Tea Cup Body -->
  <path d="M140 200 H372 C368 330 330 370 256 370 C182 370 144 330 140 200 Z" fill="url(#cupGrad)" />

  <!-- Cup Handle -->
  <path d="M360 220 C420 220 420 310 350 320" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" />

  <!-- Tea Surface -->
  <ellipse cx="256" cy="205" rx="110" ry="22" fill="url(#teaGrad)" />
  <ellipse cx="256" cy="205" rx="90" ry="14" fill="#92400e" opacity="0.4" />

  <!-- Steams -->
  <path d="M210 160 C200 130 220 110 210 80" fill="none" stroke="#fbbf24" stroke-width="12" stroke-linecap="round" opacity="0.8" />
  <path d="M256 150 C246 120 266 95 256 65" fill="none" stroke="#fbbf24" stroke-width="14" stroke-linecap="round" opacity="0.9" />
  <path d="M302 160 C292 130 312 110 302 80" fill="none" stroke="#fbbf24" stroke-width="12" stroke-linecap="round" opacity="0.8" />
</svg>
